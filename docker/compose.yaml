# Drives a SidePulse device from a container without mounting it on the host.
# Programs are checked with the firmware's own parser before anything is
# written, and the container edits the FAT volume directly with mtools, so
# nothing appears under /mnt and the host never needs a mount. Set
# SIDEPULSE_DEVICE in .env to the stable /dev/disk/by-id path of the device,
# not /dev/sdX.
services:
  sidepulse:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sidepulse-hw:local
    container_name: sidepulse
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    devices:
      - "${SIDEPULSE_DEVICE:?set SIDEPULSE_DEVICE in .env}:/dev/sidepulse"
    tmpfs: [/tmp]
    volumes:
      - ./program:/program:ro
    environment:
      POLL_SECONDS: "2"
