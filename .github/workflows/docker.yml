name: Publish sidepulse-hw image

# Builds docker and publishes it to GitHub Container Registry, so a
# TrueNAS Custom App can pull it without a local build.
on:
  push:
    branches: [security-hardening, main]
    paths:
      - "docker/**"
      - "src/sidepulse/resources/sdled.wasm"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          platforms: linux/amd64
          push: false
          cache-to: type=gha,mode=max
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/${{ github.repository_owner }}/sidepulse-hw:latest
            ghcr.io/${{ github.repository_owner }}/sidepulse-hw:${{ github.sha }}
