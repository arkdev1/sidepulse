name: Publish sidepulse-sync image

# Builds docker and publishes it to GitHub Container Registry, so a
# TrueNAS Custom App can pull it without a local build.
on:
  push:
    branches: [security-hardening, main]
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sidepulse-sync:latest
            ghcr.io/${{ github.repository_owner }}/sidepulse-sync:${{ github.sha }}
